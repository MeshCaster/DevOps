name: Deploy container to CONTABO

# Reusable workflow: build a Docker image, push it to GitHub Container Registry,
# then SSH into a CONTABO VPS and (re)start the container from the fresh image.
#
# Works for any containerized app. .NET apps get ASPNETCORE_ENVIRONMENT +
# ASPNETCORE_URLS set automatically (aspnetcore: true, the default); for Node
# and other stacks pass aspnetcore: false and set runtime env via extra-env.
#
# .NET example:
#   jobs:
#     deploy:
#       uses: MeshCaster/DevOps/.github/workflows/deploy-container.yml@main
#       with:
#         image-name: app-delivery-api
#         container-name: app-delivery-api
#         host-port: 5000
#         container-port: 80
#         network: meshcaster
#       secrets:
#         host: ${{ secrets.CONTABO_HOST }}
#         username: ${{ secrets.CONTABO_USERNAME }}
#         ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
#
# Node/Next.js example:
#   with:
#     image-name: universal-mep-site
#     container-name: universal-mep-site
#     host-port: 3000
#     container-port: 3000
#     aspnetcore: false
#     extra-env: "-e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0"
#     network: meshcaster
#
# Two environments from one repo: give each branch its own workflow file and its own
# `image-tag` + `container-name`. They share the image, not the tag.
#   dev.yml         with: { image-name: cloudy-api, image-tag: dev,    container-name: cloudy-api-dev }
#   production.yml  with: { image-name: cloudy-api, image-tag: latest, container-name: cloudy-api }
#
# Monorepo building several images: call this workflow once per image and point
# `dockerfile` at each one (the build context stays the repo root).
#   with:
#     image-name: mediathek-api
#     container-name: mediathek-api
#     dockerfile: src/Meshcaster.Mediathek.Api/Dockerfile
#     network: meshcaster
#
# Dockerfile restoring from a private feed (e.g. MeshCaster.* on GitHub Packages):
# pass the credentials as BuildKit secrets, matching the ids the Dockerfile mounts.
#   secrets:
#     build-secrets: |
#       gh_user=${{ github.actor }}
#       gh_token=${{ secrets.GITHUB_TOKEN }}

on:
  workflow_call:
    inputs:
      image-name:
        description: GHCR image name (without owner), e.g. app-delivery-api
        type: string
        required: true
      container-name:
        description: Name of the container to run on the host
        type: string
        required: true
      dockerfile:
        description: Path to the Dockerfile, relative to the repo root. Override for monorepos that build several images (e.g. src/My.Api/Dockerfile).
        type: string
        default: Dockerfile
      image-tag:
        description: >-
          Moving tag to build and deploy. Defaults to `latest`, so single-environment callers
          need no change. Give each environment its OWN tag (e.g. `dev` from the dev branch):
          two branches sharing one tag overwrite each other's deploy silently — a dev push
          becomes whatever production pulls on its next restart, with nothing to see in either
          run. The immutable `:<sha>` tag is always pushed alongside, whatever this is set to.
        type: string
        default: latest
      build-args:
        description: >-
          Multiline "KEY=value" pairs passed as Docker build args. For build-time configuration
          that cannot be injected at `docker run` — notably Next.js `NEXT_PUBLIC_*`, which is
          inlined into the client bundle during `next build`, so setting it via extra-env only
          reaches the server process and leaves the browser on the build-time default.
          NOT for secrets: build args are visible in `docker history`. Use `build-secrets`.
        type: string
        default: ""
      host-port:
        description: >-
          Port published on the host. Leave unset to publish NO port at all — correct for
          containers reached only over the Docker network (a cloudflared tunnel dialling the
          container by name, or a sidecar), which never need a host-side listener.
        type: number
        required: false
      bind-address:
        description: >-
          Host interface the published port binds to. Empty means Docker's default of 0.0.0.0,
          i.e. reachable from the internet. Set 127.0.0.1 for anything that must only be reached
          through a proxy — Docker's iptables rules bypass most host firewalls, so a published
          port is exposed even when ufw says otherwise. Ignored when host-port is unset.
        type: string
        default: ""
      container-port:
        description: Port the app listens on inside the container
        type: number
        default: 80
      aspnetcore:
        description: If true, set ASPNETCORE_ENVIRONMENT + ASPNETCORE_URLS automatically (for .NET apps). Set false for Node/other stacks.
        type: boolean
        default: true
      aspnetcore-environment:
        description: ASPNETCORE_ENVIRONMENT value (only used when aspnetcore is true)
        type: string
        default: "Production"
      volume-args:
        description: 'Extra "docker run" volume flags, single line (e.g. "-v /host:/app/uploads")'
        type: string
        default: ""
      extra-env:
        description: 'Extra "docker run" -e flags, single line (e.g. "-e Foo=Bar -e Baz=Qux")'
        type: string
        default: ""
      env-file:
        description: 'Path on the server to an env file passed to the container (--env-file), for apps with many runtime secrets. Empty = none.'
        type: string
        default: ""
      network:
        description: Docker network to attach the container to (e.g. meshcaster, to reach shared Postgres/Redis/RabbitMQ). Empty = default bridge.
        type: string
        default: ""
      ssh-port:
        description: SSH port on the CONTABO host
        type: number
        default: 22
    secrets:
      host:
        description: CONTABO host / IP (pass secrets.CONTABO_HOST)
        required: true
      username:
        description: SSH username on CONTABO (pass secrets.CONTABO_USERNAME)
        required: true
      ssh-private-key:
        description: SSH private key for CONTABO (pass secrets.CONTABO_SSH_PRIVATE_KEY)
        required: true
      build-secrets:
        description: >-
          Multiline "id=value" pairs exposed to the build as BuildKit secrets, for Dockerfiles
          that restore from a private feed. Consumed via --mount=type=secret,id=<id>, so the
          value never lands in an image layer. Empty = none.
        required: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image ref (GHCR requires lowercase)
        id: img
        run: echo "ref=ghcr.io/${OWNER,,}/${NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image-name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          secrets: ${{ secrets.build-secrets }}
          build-args: ${{ inputs.build-args }}
          tags: |
            ${{ steps.img.outputs.ref }}:${{ inputs.image-tag }}
            ${{ steps.img.outputs.ref }}:${{ github.sha }}

      - name: Deploy to CONTABO
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.username }}
          key: ${{ secrets.ssh-private-key }}
          port: ${{ inputs.ssh-port }}
          script: |
            # Without this, a failing `docker run` is masked by the exit code of
            # the last command in the script and the deploy reports success.
            set -e

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the tag this environment owns
            docker pull ${{ steps.img.outputs.ref }}:${{ inputs.image-tag }}

            # Stop and remove old container
            docker stop ${{ inputs.container-name }} || true
            docker rm ${{ inputs.container-name }} || true

            # Run new container
            docker run -d \
              --name ${{ inputs.container-name }} \
              ${{ inputs.network && format('--network {0}', inputs.network) || '' }} \
              ${{ inputs.host-port && format('-p {0}{1}:{2}', inputs.bind-address && format('{0}:', inputs.bind-address) || '', inputs.host-port, inputs.container-port) || '' }} \
              ${{ inputs.volume-args }} \
              ${{ inputs.env-file && format('--env-file {0}', inputs.env-file) || '' }} \
              --restart unless-stopped \
              ${{ inputs.aspnetcore && format('-e ASPNETCORE_ENVIRONMENT={0}', inputs.aspnetcore-environment) || '' }} \
              ${{ inputs.aspnetcore && format('-e ASPNETCORE_URLS=http://+:{0}', inputs.container-port) || '' }} \
              ${{ inputs.extra-env }} \
              ${{ steps.img.outputs.ref }}:${{ inputs.image-tag }}

            # `docker run -d` exits 0 once the container is *created*, so a container
            # that boots and dies immediately (bad config, missing env) still looks
            # like a success. Confirm it is actually up, and surface logs if not.
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' ${{ inputs.container-name }} 2>/dev/null)" != "true" ]; then
              echo "::error::Container ${{ inputs.container-name }} is not running after deploy"
              docker logs --tail 50 ${{ inputs.container-name }} 2>&1 || true
              exit 1
            fi
            echo "Container ${{ inputs.container-name }} is up."

            # Cleanup old images
            docker image prune -f
