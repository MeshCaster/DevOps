# Meshcaster.BeautyBook — reverse proxy for the tools/nginx stack.
#
# ONE upstream on the `meshcaster` network, deployed via .github/workflows/deploy.yml from the
# MeshCaster/Meshcaster.BeautyBook repo:
#
#   beautybook-api:8080     public API consumed by the Expo mobile app (host port 5110)
#
# The admin panel is deliberately NOT here. It has no login of its own, so it is reached only
# through the Cloudflare tunnel (applications/infrastructure/cloudflared), which dials
# beautybook-admin:8080 over the `meshcaster` network after Cloudflare Access has authenticated
# the operator at the edge. It publishes no host port and terminates no TLS on this box. Adding
# an nginx vhost for it would re-open the public path that Access exists to close.
#
# proxy-common.conf already carries the websocket upgrade + X-Forwarded-* headers, so this is a
# plain single-upstream proxy. BeautyBook deliberately does not expose the booking SDK's
# /hubs/booking (backend-spec Decision 3), so no long-timeout websocket location is needed.
#
# Domains:
#   beautybook.in-vent.online         -> API            (this file)
#   admin.beautybook.in-vent.online   -> admin panel    (Cloudflare tunnel, not nginx)
#
#   tools/nginx/add-app.sh --app beautybook \
#     --domains "beautybook.in-vent.online" \
#     --upstream beautybook-api:8080 --ws-path none
#   # then replace the generated vhost with this file and reload
#
# The API validates tokens issued by https://identity.in-vent.online, so that vhost and its
# certificate must be live first — an https authority sets RequireHttpsMetadata, and until the
# discovery document is reachable every authenticated request fails.

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name beautybook.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — public API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beautybook.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/beautybook.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/beautybook.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/beautybook.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # JSON only — the API accepts no uploads (a salon's image is a string reference, not a file).
    client_max_body_size 1M;

    # The root-admin surface must never be reachable from the internet. The admin panel calls it
    # over the `meshcaster` Docker network as http://beautybook-api:8080, never through nginx, so
    # closing it here costs nothing and removes a path to platform-wide CRUD. Defence in depth:
    # the API also gates these routes on the `beautybook:admin` scope.
    location /api/admin { return 404; }

    location / {
        proxy_pass http://beautybook-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
