# Meshcaster.BeautyBook — reverse proxy for the tools/nginx stack.
#
# ONE upstream on the `meshcaster` network, deployed via .github/workflows/deploy.yml from the
# MeshCaster/Meshcaster.BeautyBook repo:
#
#   beautybook-api:8080     public API consumed by the Expo mobile app (host port 5110)
#
# The admin panel is deliberately NOT here. It is reached through the Cloudflare tunnel
# (applications/infrastructure/cloudflared), which dials beautybook-admin:8080 over the
# `meshcaster` network. It publishes no host port and terminates no TLS on this box, and keeping
# it off nginx is what stops it being reachable by IP or by a stray Host header.
#
# The SALON console is here, though, and is the reason this file has a second upstream. Salon
# owners cannot reach the tunnel-served panel at all — its Cloudflare Access policy allows operator
# emails — so they get their own instance, published normally:
#
#   beautybook-my:8080      the same image with Panel__SalonOnly=true, which makes it refuse the
#                           platform-wide pages to everyone. It also carries no
#                           Identity__ClientSecret, so the container exposed to the internet does
#                           not hold the machine-to-machine credential for /api/admin.
#
# proxy-common.conf already carries the websocket upgrade + X-Forwarded-* headers, so this is a
# plain single-upstream proxy. BeautyBook deliberately does not expose the booking SDK's
# /hubs/booking (backend-spec Decision 3), so no long-timeout websocket location is needed.
#
# Domains:
#   beautybook.in-vent.online         -> API            (this file)
#   beautybook-my.in-vent.online      -> salon console  (this file)
#   beautybook-admin.in-vent.online   -> admin panel    (Cloudflare tunnel, not nginx)
#
# Both names here are SECOND level: Cloudflare's Universal SSL covers *.in-vent.online and no
# deeper, so a third-level name cannot complete a TLS handshake at the edge.
#
#   tools/nginx/add-app.sh --app beautybook \
#     --domains "beautybook.in-vent.online" \
#     --upstream beautybook-api:8080 --ws-path none
#   # then replace the generated vhost with this file and reload
#
# The API validates tokens issued by https://identity.in-vent.online, so that vhost and its
# certificate must be live first — an https authority sets RequireHttpsMetadata, and until the
# discovery document is reachable every authenticated request fails.

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name beautybook.in-vent.online beautybook-my.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — public API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beautybook.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/beautybook.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/beautybook.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/beautybook.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # JSON only — the API accepts no uploads (a salon's image is a string reference, not a file).
    client_max_body_size 1M;

    # The root-admin surface must never be reachable from the internet. The admin panel calls it
    # over the `meshcaster` Docker network as http://beautybook-api:8080, never through nginx, so
    # closing it here costs nothing and removes a path to platform-wide CRUD. Defence in depth:
    # the API also gates these routes on the `beautybook:admin` scope.
    location /api/admin { return 404; }

    location / {
        proxy_pass http://beautybook-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# ---------- HTTPS :443 — salon console ----------
#
# Deliberately no /api/admin block like the API vhost has: this upstream is the panel, not the API,
# and it reaches the API over the Docker network rather than back through nginx.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beautybook-my.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/beautybook-my.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/beautybook-my.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/beautybook-my.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Product and service photos are uploaded through this panel, and the API caps them at 5 MB.
    # Left at nginx's 1 MB default the upload would fail as a 413 before the API ever saw it.
    client_max_body_size 6M;

    location / {
        proxy_pass http://beautybook-my:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
