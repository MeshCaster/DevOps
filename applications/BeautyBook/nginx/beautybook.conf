# Meshcaster.BeautyBook — reverse proxy for the tools/nginx stack.
#
# Two upstreams on the `meshcaster` network, both deployed via .github/workflows/deploy.yml
# from the MeshCaster/Meshcaster.BeautyBook repo:
#
#   beautybook-api:8080     public API consumed by the Expo mobile app (host port 5110)
#   beautybook-admin:8080   Razor Pages root-admin panel            (host port 5111)
#
# proxy-common.conf already carries the websocket upgrade + X-Forwarded-* headers, so both are
# plain single-upstream proxies. BeautyBook deliberately does not expose the booking SDK's
# /hubs/booking (backend-spec Decision 3), so no long-timeout websocket location is needed.
#
# Domains:
#   beautybook.in-vent.online         -> API
#   admin.beautybook.in-vent.online   -> admin panel
#
#   tools/nginx/add-app.sh --app beautybook \
#     --domains "beautybook.in-vent.online admin.beautybook.in-vent.online" \
#     --upstream beautybook-api:8080 --ws-path none
#   # then replace the generated vhost with this file and reload
#
# The API validates tokens issued by https://identity.in-vent.online, so that vhost and its
# certificate must be live first — an https authority sets RequireHttpsMetadata, and until the
# discovery document is reachable every authenticated request fails.

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name beautybook.in-vent.online admin.beautybook.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — public API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beautybook.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/beautybook.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/beautybook.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/beautybook.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # JSON only — the API accepts no uploads (a salon's image is a string reference, not a file).
    client_max_body_size 1M;

    # The root-admin surface must never be reachable from the internet. The admin panel calls it
    # over the `meshcaster` Docker network as http://beautybook-api:8080, never through nginx, so
    # closing it here costs nothing and removes a path to platform-wide CRUD. Defence in depth:
    # the API also gates these routes on the `beautybook:admin` scope.
    location /api/admin { return 404; }

    location / {
        proxy_pass http://beautybook-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# ---------- HTTPS :443 — admin panel ----------
#
# WARNING — the panel has no authentication of its own. It authenticates *itself* to the API as
# the beautybook-admin-m2m client, but nothing authenticates the *operator* to the panel: there is
# no login page and no [Authorize]. Anyone who can reach this vhost gets root CRUD over every
# salon, specialist, service and slot on the platform.
#
# So this vhost is gated on HTTP basic auth. Create the password file on the host before the first
# reload — nginx returns 500 for a missing auth_basic_user_file, which fails closed rather than
# serving the panel wide open:
#
#   sudo htpasswd -c /opt/nginx/nginx/snippets/beautybook-admin.htpasswd <operator>
#   sudo docker exec nginx-proxy nginx -t && sudo docker exec nginx-proxy nginx -s reload
#
# It lives beside the snippets because init-nginx.sh mounts only nginx.conf, conf.d/, snippets/,
# certbot/ and logs/ into the container — there is no secrets/ mount to put it in, and adding one
# means editing the generated compose file. `snippets/` is already mounted read-only, which is
# exactly what this file needs.
#
# Basic auth is a stopgap, not the destination. Replace it with real sign-in in the panel (an
# OIDC authorization-code flow against MeshCaster.Identity, gated on an admin role) and then drop
# these two directives.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.beautybook.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/admin.beautybook.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/admin.beautybook.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.beautybook.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Form posts only.
    client_max_body_size 1M;

    auth_basic           "BeautyBook Admin";
    auth_basic_user_file /etc/nginx/snippets/beautybook-admin.htpasswd;

    # An operator console has no business being indexed or framed.
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://beautybook-admin:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
