# cloudy — the Cloudy PRODUCTION environment, for the tools/nginx stack.
#
# Two vhosts, both proxying containers on the `meshcaster` network:
#   cloudy-api.in-vent.online -> cloudy-api:8080   (.NET API + /media)
#   cloudy.in-vent.online     -> cloudy-web:3000   (Next.js storefront)
#
# The back office is deliberately ABSENT. cloudy-admin is reached through the
# cloudflared tunnel with a Cloudflare Access policy, not through nginx — it can refund
# money and its sign-in gate is client-side only. Do not add a vhost for it here.
#
# Neither container publishes a host port, so nginx is the only way in; there is no
# second, unproxied door on the internet.
#
#   tools/nginx/remote-setup.sh -i ~/.ssh/meshcaster_contabo_vps_1 root@169.58.27.99 \
#     --skip-init --email <acme-email> \
#     --cert "cloudy-api.in-vent.online cloudy.in-vent.online" \
#     --conf applications/Cloudy/nginx/cloudy.conf

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name cloudy-api.in-vent.online cloudy.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — the API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloudy-api.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/cloudy-api.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/cloudy-api.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cloudy-api.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # The sell flow uploads garment photos. The API downscales and re-encodes them, but
    # the original still has to arrive intact — a phone photo is routinely 8–12 MB.
    client_max_body_size 25M;

    # Photo bytes, served by the API from its bind-mounted /app/media. Cached hard
    # because a published photo never changes: the intake pipeline re-encodes on the way
    # in and a correction is a new upload with a new path, never an overwrite.
    location /media/ {
        proxy_pass http://cloudy-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://cloudy-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# ---------- HTTPS :443 — the storefront ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloudy.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/cloudy-api.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/cloudy-api.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cloudy-api.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Nothing here accepts an upload — the browser posts photos to the API host directly.
    client_max_body_size 1M;

    # Next.js serves its own hashed assets out of /_next/static. Content-addressed, so
    # they can be cached indefinitely.
    location /_next/static/ {
        proxy_pass http://cloudy-web:3000;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://cloudy-web:3000;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
