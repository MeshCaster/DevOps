# Motors Admin — Blazor Server back office for Meshcaster.Motors (Tvali), for the tools/nginx stack.
#
# Upstream: container `motors-admin:8080` on the `meshcaster` network (no published port).
# Sign-in is MeshCaster.Identity (OIDC); the app calls motors-api over the docker network.
# Blazor keeps a SignalR circuit open on /_blazor, so that path gets long timeouts.
#
# Domain: motors-admin.in-vent.online   (one level under in-vent.online so Cloudflare Universal SSL covers it when proxied; Cloudflare Access recommended)

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name motors-admin.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — admin app ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motors-admin.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/motors-admin.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/motors-admin.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/motors-admin.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Back office: never indexed, never framed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 5M;

    location /_blazor {
        proxy_pass http://motors-admin:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://motors-admin:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
