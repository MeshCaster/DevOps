# Motor info website — Blazor static SSR (Meshcaster.Motors.Web), for the tools/nginx stack.
#
# Upstream: container `motors-web:8080` on the `meshcaster` network (no published port).
# Plain server-rendered pages and small form posts; no websocket. Content comes from motors-api.
#
# Domain: motor.in-vent.online   (one level under in-vent.online so Cloudflare Universal SSL covers it when proxied)

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name motor.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — website ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motor.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/motor.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/motor.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/motor.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Forms are a few fields; nothing large is ever posted here.
    client_max_body_size 64k;

    # Fingerprinted static assets (MapStaticAssets) can be cached hard.
    location /_content/ {
        proxy_pass http://motors-web:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        expires 30d;
    }

    location / {
        proxy_pass http://motors-web:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
