# Meshcaster.Motors (Tvali) — .NET API reverse proxy for the tools/nginx stack.
#
# Upstream: container `motors-api:8080` on the `meshcaster` network (no published port;
# this vhost is the only way in). See ../bootstrap-env.sh for the container + env setup.
#
# SignalR hubs live under /hubs/ (assistant chat, live vehicle data), so that prefix gets
# long timeouts; proxy-common.conf already carries the websocket upgrade + X-Forwarded-*.
#
# Domain: motors.in-vent.online

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name motors.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — public API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motors.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/motors.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/motors.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/motors.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Warning-light photos and receipts.
    client_max_body_size 20M;

    location /hubs/ {
        proxy_pass http://motors-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://motors-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
