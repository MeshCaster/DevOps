# Meshcaster.Payments — the payments gateway (MeshCaster/Meshcaster.Payments).
#
#   payments-api:8080   on the `meshcaster` network, deployed by .github/workflows/deploy.yml in that
#                       repo. It publishes no host port.
#
# Only what the payment provider needs is public:
#   /flitt/callback   Flitt's server-to-server status callbacks (signature-checked by the service)
#   /flitt/return     where Flitt sends the payer's browser after the checkout
#   /bog/callback     Bank of Georgia's callbacks (RSA-signed; checked by the service)
#   /bog/return/{id}  where BOG sends the payer's browser after the checkout
#   /health           liveness
#
# Everything else — in particular the /v1 product API that creates, captures and refunds payments —
# answers 404 here. Products call it as http://payments-api:8080 over the Docker network with their
# own machine-to-machine tokens, never through nginx. Defence in depth: /v1 also requires an Identity
# token with the `payments` scope.
#
# Domain:
#   payments.in-vent.online
#
#   tools/nginx/add-app.sh --app payments \
#     --domains "payments.in-vent.online" \
#     --upstream payments-api:8080 --ws-path none
#   # then replace the generated vhost with this file and reload

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name payments.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name payments.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/payments.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/payments.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/payments.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Callbacks are small JSON or form bodies.
    client_max_body_size 64k;

    # Flitt gives up after 30 s and retries; the service answers as soon as the callback is stored.
    location /flitt/ {
        proxy_pass http://payments-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 30s;
    }

    # Same for Bank of Georgia. The service verifies the RSA signature over the exact body bytes, so
    # nothing here may rewrite or re-encode the body.
    location /bog/ {
        proxy_pass http://payments-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://payments-api:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / { return 404; }
}
